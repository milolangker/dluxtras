# Builds the docs with zensical and deploys them to the gh-pages branch with mike,
# as dLux does: pushes to main update the "dev" version; tags v* publish that version
# as "latest". Enable GitHub Pages (Settings > Pages > branch gh-pages) to serve it.
name: Documentation
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
          python -m pip install git+https://github.com/squidfunk/mike.git  # as dLux does

      - name: Build documentation
        run: zensical build --strict

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy development documentation
        if: github.ref == 'refs/heads/main'
        run: mike deploy --config-file mkdocs.yml --push dev

      - name: Deploy release documentation
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --config-file mkdocs.yml --push --update-aliases "$VERSION" latest
          mike set-default --config-file mkdocs.yml --push latest
